<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// ESCENA
// ============================================================

const scene =
    new THREE.Scene();

(function(){

    const c = document.createElement("canvas");

    c.width = 2;
    c.height = 256;

    const g = c.getContext("2d");

    const degradado =
        g.createLinearGradient(0, 0, 0, 256);

    degradado.addColorStop(0,   "#9fb8c7");
    degradado.addColorStop(.55, "#c9d3d8");
    degradado.addColorStop(1,   "#e3e6e4");

    g.fillStyle = degradado;
    g.fillRect(0, 0, 2, 256);

    const cielo = new THREE.CanvasTexture(c);

    cielo.colorSpace = THREE.SRGBColorSpace;

    scene.background = cielo;

})();


// ============================================================
// CÁMARA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        48,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    75,
    80,
    95
);


// ============================================================
// RENDER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// CONTROLES
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .055;

controls.minDistance = 20;

controls.maxDistance = 170;

controls.maxPolarAngle =
    Math.PI / 2.05;

controls.target.set(
    -25,
    0,
    5
);


// ============================================================
// ILUMINACIÓN
// ============================================================

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x737373,
        2.1
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.7
    );

sun.position.set(
    -60,
    120,
    70
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.bias = -0.0005;

sun.shadow.normalBias = 0.05;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


// ============================================================
// TERRENO
// ============================================================

const terrenoGeo =
    new THREE.BoxGeometry(
        106,
        1,
        104
    );

const terrenoMat =
    new THREE.MeshStandardMaterial({
        color:0xd7d7d7,
        roughness:.95
    });

const terreno =
    new THREE.Mesh(
        terrenoGeo,
        terrenoMat
    );

terreno.position.set(
    -27,
    -.5,
    5
);

terreno.receiveShadow = true;

(function(){

    const c = document.createElement("canvas");

    c.width = 256;
    c.height = 256;

    const g = c.getContext("2d");

    g.fillStyle = "#d9d9d7";
    g.fillRect(0, 0, 256, 256);

    for(let i = 0; i < 900; i++){

        g.fillStyle =
            "rgba(0,0,0," + (Math.random() * .05) + ")";

        g.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            2,
            2
        );

    }

    g.strokeStyle = "rgba(0,0,0,.12)";
    g.lineWidth = 2;
    g.strokeRect(1, 1, 254, 254);

    const textura = new THREE.CanvasTexture(c);

    textura.colorSpace = THREE.SRGBColorSpace;
    textura.wrapS = THREE.RepeatWrapping;
    textura.wrapT = THREE.RepeatWrapping;
    textura.repeat.set(26, 26);
    textura.anisotropy = 4;

    terrenoMat.map = textura;
    terrenoMat.color.set(0xffffff);
    terrenoMat.needsUpdate = true;

})();

scene.add(terreno);


// ============================================================
// GRUPOS
// ============================================================

const edificios = [];

const arboles = [];

const etiquetas = [];


// Solo se vuelve a dibujar la escena cuando algo cambia.
// Así la computadora descansa cuando no estás moviendo nada.

let necesitaRender = true;

function pedirRender(){

    necesitaRender = true;

}


// ============================================================
// MATERIALES Y GEOMETRÍAS COMPARTIDAS (ahorran memoria)
// ============================================================

const MAT = {

    vidrio :
        new THREE.MeshStandardMaterial({
            color:0x7f9eab,
            roughness:.15,
            metalness:.35
        }),

    marco :
        new THREE.MeshStandardMaterial({
            color:0xf4f4f4,
            roughness:.7
        }),

    zocalo :
        new THREE.MeshStandardMaterial({
            color:0x9b9b9b,
            roughness:.9
        }),

    techo :
        new THREE.MeshStandardMaterial({
            color:0xd4d4d4,
            roughness:.85
        }),

    linea :
        new THREE.MeshStandardMaterial({
            color:0xb8b8b8
        }),

    fachada :
        new THREE.MeshStandardMaterial({
            color:0xf1f1f1
        }),

    puerta :
        new THREE.MeshStandardMaterial({
            color:0x4b5960,
            roughness:.5
        }),

    escalon :
        new THREE.MeshStandardMaterial({
            color:0xbdbdbd
        })

};

const GEO = {

    vidrio  : new THREE.BoxGeometry(1.5, 1.45, .08),

    marco   : new THREE.BoxGeometry(1.8, 1.75, .06),

    repisa  : new THREE.BoxGeometry(1.95, .14, .32),

    puerta  : new THREE.BoxGeometry(1.9, 2.8, .10),

    escalon : new THREE.BoxGeometry(3.4, .25, .55)

};


// ============================================================
// FUNCIÓN PRINCIPAL DE EDIFICIO
// ============================================================

function crearEdificio(opciones){

    const {

        nombre,
        descripcion,

        x,
        z,

        ancho,
        fondo,

        altura,

        niveles = 1,

        color = 0xe5e5e5,

        ventanas = true,

        fachada = true

    } = opciones;


    const grupo =
        new THREE.Group();

    grupo.position.set(x, 0, z);

    grupo.userData.nombre = nombre;
    grupo.userData.descripcion = descripcion;
    grupo.userData.tipo = "Edificio";


    // Agrega una pieza al edificio
    function agregar(geo, mat, px, py, pz, sombra = true){

        const pieza = new THREE.Mesh(geo, mat);

        pieza.position.set(px, py, pz);

        pieza.castShadow = sombra;
        pieza.receiveShadow = true;

        grupo.add(pieza);

        return pieza;

    }


    // --------------------------------------------------------
    // CUERPO Y ZÓCALO
    // --------------------------------------------------------

    agregar(
        new THREE.BoxGeometry(ancho, altura, fondo),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.8
        }),
        0, altura / 2, 0
    );

    agregar(
        new THREE.BoxGeometry(ancho + .2, .7, fondo + .2),
        MAT.zocalo,
        0, .35, 0
    );


    // --------------------------------------------------------
    // LÍNEAS ENTRE PISOS
    // --------------------------------------------------------

    for(let i = 1; i < niveles; i++){

        agregar(
            new THREE.BoxGeometry(ancho + .08, .12, fondo + .08),
            MAT.linea,
            0, altura * (i / niveles), 0
        );

    }


    // --------------------------------------------------------
    // TECHO Y ANTEPECHO
    // --------------------------------------------------------

    agregar(
        new THREE.BoxGeometry(ancho + .3, .25, fondo + .3),
        MAT.techo,
        0, altura + .12, 0
    );

    const alto = .5;
    const grosor = .22;
    const yAntepecho = altura + .25 + alto / 2;

    const geoAntepechoLargo =
        new THREE.BoxGeometry(ancho + .3, alto, grosor);

    const geoAntepechoCorto =
        new THREE.BoxGeometry(grosor, alto, fondo + .3 - grosor * 2);

    agregar(geoAntepechoLargo, MAT.techo,
        0, yAntepecho, fondo / 2 + .15 - grosor / 2);

    agregar(geoAntepechoLargo, MAT.techo,
        0, yAntepecho, -(fondo / 2 + .15 - grosor / 2));

    agregar(geoAntepechoCorto, MAT.techo,
        ancho / 2 + .15 - grosor / 2, yAntepecho, 0);

    agregar(geoAntepechoCorto, MAT.techo,
        -(ancho / 2 + .15 - grosor / 2), yAntepecho, 0);


    // --------------------------------------------------------
    // FACHADA
    // --------------------------------------------------------

    if(fachada){

        const alturaFachada =
            Math.min(2.7, altura * .40);

        agregar(
            new THREE.BoxGeometry(ancho * .72, alturaFachada, .14),
            MAT.fachada,
            0, alturaFachada / 2 + .25, fondo / 2 + .08,
            false
        );

    }


    // --------------------------------------------------------
    // VENTANAS (en todos los pisos y en las 4 caras)
    // --------------------------------------------------------

    if(ventanas){

        const caras = [

            { largo:ancho, x:0,         z: fondo / 2, giro:0,            frente:true  },
            { largo:ancho, x:0,         z:-fondo / 2, giro:Math.PI,      frente:false },
            { largo:fondo, x: ancho / 2, z:0,         giro:Math.PI / 2,  frente:false },
            { largo:fondo, x:-ancho / 2, z:0,         giro:-Math.PI / 2, frente:false }

        ];

        const vidrios = [];
        const marcos = [];
        const repisas = [];

        const alturaNivel = altura / niveles;

        const base = new THREE.Matrix4();
        const local = new THREE.Matrix4();

        caras.forEach(function(cara){

            const cantidad =
                Math.max(3, Math.floor(cara.largo / 4));

            const separacion =
                cara.largo / (cantidad + 1);

            base
                .makeRotationY(cara.giro)
                .setPosition(cara.x, 0, cara.z);

            for(let nivel = 0; nivel < niveles; nivel++){

                const y =
                    nivel * alturaNivel +
                    alturaNivel * .55;

                for(let i = 0; i < cantidad; i++){

                    const u =
                        -cara.largo / 2 +
                        separacion * (i + 1);

                    // No tapar la puerta principal
                    if(
                        cara.frente &&
                        nivel === 0 &&
                        Math.abs(u) < 1.9
                    ){
                        continue;
                    }

                    vidrios.push(
                        base.clone().multiply(
                            local.makeTranslation(u, y, .15)
                        )
                    );

                    marcos.push(
                        base.clone().multiply(
                            local.makeTranslation(u, y, .12)
                        )
                    );

                    repisas.push(
                        base.clone().multiply(
                            local.makeTranslation(u, y - .88, .17)
                        )
                    );

                }

            }

        });


        // Una sola pieza dibuja todas las ventanas iguales
        const instanciar = function(geo, mat, lista){

            if(lista.length === 0){
                return;
            }

            const piezas =
                new THREE.InstancedMesh(
                    geo,
                    mat,
                    lista.length
                );

            lista.forEach(function(matriz, i){

                piezas.setMatrixAt(i, matriz);

            });

            piezas.instanceMatrix.needsUpdate = true;

            grupo.add(piezas);

        };

        instanciar(GEO.marco,  MAT.marco,  marcos);
        instanciar(GEO.vidrio, MAT.vidrio, vidrios);
        instanciar(GEO.repisa, MAT.marco,  repisas);

    }


    // --------------------------------------------------------
    // PUERTA
    // --------------------------------------------------------

    agregar(
        GEO.puerta,
        MAT.puerta,
        0, 1.4, fondo / 2 + .16,
        false
    );


    // --------------------------------------------------------
    // ESCALERA
    // --------------------------------------------------------

    if(
        niveles > 1 &&
        ancho > 15
    ){

        for(let i = 0; i < 6; i++){

            agregar(
                GEO.escalon,
                MAT.escalon,
                ancho * .28,
                .125 + i * .22,
                fondo / 2 + .55 + i * .42
            );

        }

    }


    scene.add(grupo);

    edificios.push(grupo);

    return grupo;
}


// ============================================================
// EDIFICIOS
// ============================================================

// ============================================================
// GIMNASIO — MODELO GLB
// ============================================================

// Controla la pantalla de carga: se quita cuando el modelo
// terminó de cargar (o falló), no después de un tiempo fijo.

const gestorCarga = new THREE.LoadingManager();

const inicioCarga = performance.now();

let cargaOculta = false;

function ocultarCarga(){

    if(cargaOculta){
        return;
    }

    cargaOculta = true;

    const pantalla =
        document.getElementById("loading");

    pantalla.style.opacity = "0";

    setTimeout(
        function(){
            pantalla.style.display = "none";
        },
        400
    );

    pedirRender();

}

gestorCarga.onLoad = function(){

    const espera =
        Math.max(
            0,
            500 - (performance.now() - inicioCarga)
        );

    setTimeout(ocultarCarga, espera);

};

// Si algo tarda demasiado, no dejar la pantalla de carga para siempre
setTimeout(ocultarCarga, 12000);


const loaderGimnasio = new GLTFLoader(gestorCarga);

loaderGimnasio.load(

    "gimnasio.glb",

    function(gltf){

        const gimnasio = gltf.scene;

        gimnasio.userData.nombre =
            "Gimnasio";

        gimnasio.userData.descripcion =
            "Gimnasio de la Unidad I de la ENMS Salamanca.";

        gimnasio.userData.tipo =
            "Edificio";

        gimnasio.position.set(-45, 0.5, -22);

        gimnasio.scale.set(0.75 , 1.1, 1 );

        gimnasio.rotation.set(0, 0, 0);

        gimnasio.traverse(
            function(objeto){

                if(objeto.isMesh){

                    objeto.castShadow = true;

                    objeto.receiveShadow = true;

                }

            }
        );

        scene.add(gimnasio);

        edificios.push(gimnasio);

        pedirRender();

    },

    undefined,

    function(error){

        console.error(
            "Error al cargar gimnasio.glb:",
            error
        );

        // Si el archivo no está junto al index.html, se muestra
        // un volumen provisional para que el gimnasio no falte.

        crearEdificio({

            nombre:
                "Gimnasio",

            descripcion:
                "Gimnasio de la Unidad I de la ENMS Salamanca.",

            x:-40,
            z:-22,

            ancho:26,
            fondo:20,

            altura:9,

            niveles:1,

            color:0xdadada,

            ventanas:false,

            fachada:false

        });

        pedirRender();

    }

);

// BIBLIOTECA

crearEdificio({

    nombre:
        "Biblioteca",

    descripcion:
        "Biblioteca de la ENMS Salamanca.",

    x:-7,
    z:-32,

    ancho:23,
    fondo:13,

    altura:5.4,

    niveles:1,

    color:0xe4e4e4,

    ventanas:true

});


// E1

crearEdificio({

    nombre:
        "Edificio 1",

    descripcion:
        "Edificio academico 1.",

    x:-8,
    z:-14,

    ancho:22,
    fondo:14,

    altura:7.8,

    niveles:2,

    color:0xe1e1e1,

    ventanas:true

});


// EDIFICIO PRINCIPAL — MODELO GLB
// Coloca principal.glb en la misma carpeta que index.html.

const loaderPrincipal = new GLTFLoader(gestorCarga);

loaderPrincipal.load(

    "principal.glb",

    function(gltf){

        const principal = gltf.scene;

        principal.userData.nombre = "Edificio Principal";
        principal.userData.descripcion =
            "Edificio principal de la Unidad I de la ENMS Salamanca.";
        principal.userData.tipo = "Edificio";

        // Calcular el tamaño original del modelo.
        principal.updateMatrixWorld(true);

        const cajaOriginal = new THREE.Box3().setFromObject(principal);
        const tamanoOriginal = new THREE.Vector3();
        cajaOriginal.getSize(tamanoOriginal);

        // Ajustar el ancho/largo horizontal máximo a 48 unidades.
        const mayorHorizontal = Math.max(
            tamanoOriginal.x,
            tamanoOriginal.z
        );

       if (mayorHorizontal > 0) {
    const escala = 48 / mayorHorizontal;

    principal.scale.set(
        escala * 2,  // Más largo
        escala * 2,  // Más alto
        escala         // Mantiene el fondo
    );
}

        principal.updateMatrixWorld(true);

        // Centrarlo en la ubicación del edificio principal anterior
        // y apoyarlo sobre la superficie del terreno.
        const cajaFinal = new THREE.Box3().setFromObject(principal);
        const centroFinal = new THREE.Vector3();
        cajaFinal.getCenter(centroFinal);

        principal.position.x += -27 - centroFinal.x;
        principal.position.z += 6 - centroFinal.z;
        principal.position.y += -cajaFinal.min.y - 1;

        principal.traverse(function(objeto){
            if (objeto.isMesh) {
                objeto.castShadow = true;
                objeto.receiveShadow = true;
            }
        });

// ============================================================
// FUNCIONES AUXILIARES PARA ÁRBOLES
// ============================================================

function crearRama(
    grupo,
    x,
    y,
    z,
    largo,
    grosor,
    rotX = 0,
    rotZ = 0,
    color = 0x765438
){

    const geo =
        new THREE.CylinderGeometry(
            grosor*.75,
            grosor,
            largo,
            6
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        });

    const rama =
        new THREE.Mesh(
            geo,
            mat
        );

    rama.position.set(
        x,
        y,
        z
    );

    rama.rotation.x =
        rotX;

    rama.rotation.z =
        rotZ;

    rama.castShadow = true;

    grupo.add(
        rama
    );

    return rama;
}

// ============================================================
// FUNCIÓN PRINCIPAL PARA CREAR ÁRBOLES
// ============================================================

function crearArbol(opciones){

    const {

        nombre,
        especie,
        descripcion,
        importancia,
        beneficio,

        x,
        z,

        escala = 1,

        modelo = "ficus",

        alturaInfo = "",
        caracteristica = "",
        dato = ""

    } = opciones;


    const grupo =
        new THREE.Group();


    grupo.position.set(
        x,
        0,
        z
    );


    grupo.scale.set(
        escala,
        escala,
        escala
    );


    // --------------------------------------------------------
    // INFORMACIÓN
    // --------------------------------------------------------

    grupo.userData.nombre =
        nombre;

    grupo.userData.descripcion =
        descripcion;

    grupo.userData.tipo =
        "Árbol";

    grupo.userData.especie =
        especie;

    grupo.userData.importancia =
        importancia;

    grupo.userData.beneficio =
        beneficio;

    grupo.userData.alturaInfo =
        alturaInfo;

    grupo.userData.caracteristica =
        caracteristica;

    grupo.userData.dato =
        dato;


    // --------------------------------------------------------
    // MODELO VISUAL
    // --------------------------------------------------------

    if(modelo === "guayabero"){

        crearGuayabero(grupo);

    }

    else if(modelo === "eucalipto"){

        crearEucalipto(grupo);

    }

    else if(modelo === "ficus-variegado"){

        crearFicusVariegado(grupo);

    }

    else if(modelo === "araucaria"){

        crearAraucaria(grupo);

    }

    else{

        crearFicus(grupo);

    }


    scene.add(
        grupo
    );


    arboles.push(
        grupo
    );


    return grupo;
}

function crearEtiqueta(
    texto,
    x,
    y,
    z
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "rgba(255,255,255,.92)";

    ctx.beginPath();

    if(ctx.roundRect){

        ctx.roundRect(5, 5, 502, 118, 18);

    }
    else{

        ctx.rect(5, 5, 502, 118);

    }

    ctx.fill();

    ctx.fillStyle =
        "#263238";

    ctx.font =
        "bold 42px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        texto,
        256,
        64
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.position.set(
        x,
        y,
        z
    );

    sprite.scale.set(
    16,
    4,
    1
);

    scene.add(
        sprite
    );

    etiquetas.push(
        sprite
    );
}

// ============================================================
// INTERACCIÓN
// ============================================================

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

let resaltado = null;

const inicioToque = { x:0, y:0 };


function quitarResaltado(){

    if(resaltado){

        scene.remove(resaltado);

        resaltado.geometry.dispose();

        resaltado.material.dispose();

        resaltado = null;

    }

}


function mostrarInformacion(objeto){

    // Marco amarillo alrededor del elemento elegido

    quitarResaltado();

    resaltado =
        new THREE.BoxHelper(objeto, 0xffb300);

    scene.add(resaltado);


    document.getElementById(
        "infoTitle"
    ).textContent =
        objeto.userData.nombre;

    document.getElementById(
        "infoText"
    ).textContent =
        objeto.userData.descripcion;

    document.getElementById(
        "infoType"
    ).textContent =
        objeto.userData.tipo || "Elemento";


    const extra =
        document.getElementById(
            "infoExtra"
        );

    extra.innerHTML = "";


    if(
        objeto.userData.tipo ===
        "Árbol"
    ){

        extra.innerHTML = `

            <div class="treeInfographic">

                <div class="treeScientific">

                    🌿 ${objeto.userData.especie}

                </div>


                <div class="treeGrid">

                    <div class="treeCard">

                        <b>📏 Altura</b>

                        <span>
                            ${objeto.userData.alturaInfo}
                        </span>

                    </div>


                    <div class="treeCard">

                        <b>🍃 Característica</b>

                        <span>
                            ${objeto.userData.caracteristica}
                        </span>

                    </div>


                    <div class="treeCard">

                        <b>🌎 Importancia</b>

                        <span>
                            ${objeto.userData.importancia}
                        </span>

                    </div>


                    <div class="treeCard">

                        <b>💧 Beneficio</b>

                        <span>
                            ${objeto.userData.beneficio}
                        </span>

                    </div>

                </div>


                <h3>💡 Dato interesante</h3>

                <p>
                    ${objeto.userData.dato}
                </p>

            </div>

        `;

    }


    document.getElementById(
        "information"
    ).style.display =
        "block";

    pedirRender();

}


// Se registra dónde empezó el clic para distinguir
// "hacer clic" de "arrastrar para girar la vista".

renderer.domElement.addEventListener(
    "pointerdown",
    function(event){

        inicioToque.x = event.clientX;

        inicioToque.y = event.clientY;

    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function(event){

        const movimiento =
            Math.hypot(
                event.clientX - inicioToque.x,
                event.clientY - inicioToque.y
            );

        // Si el puntero se movió, el usuario estaba girando la vista
        if(movimiento > 6){
            return;
        }


        const caja =
            renderer.domElement.getBoundingClientRect();

        mouse.x =
            ((event.clientX - caja.left) /
            caja.width) * 2 - 1;

        mouse.y =
            -((event.clientY - caja.top) /
            caja.height) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );

        const intersecciones =
            raycaster.intersectObjects(
                [...edificios, ...arboles],
                true
            );


        // Clic en el vacío: se cierra el panel
        if(intersecciones.length === 0){

            cerrarInformacion();

            return;

        }


        // Buscar el grupo padre que tiene la información

        let objeto =
            intersecciones[0].object;

        while(
            objeto.parent &&
            !objeto.userData.nombre
        ){

            objeto =
                objeto.parent;

        }

        if(!objeto.userData.nombre){
            return;
        }

        mostrarInformacion(objeto);

    }
);


// ============================================================
// CERRAR PANEL
// ============================================================

function cerrarInformacion(){

    document.getElementById(
        "information"
    ).style.display =
        "none";

    quitarResaltado();

    pedirRender();

}

window.cerrarInformacion =
    cerrarInformacion;

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            cerrarInformacion();

        }

    }
);

// ============================================================
// VISTAS (con movimiento suave de cámara)
// ============================================================

let movimientoCamara = null;

function irA(posicion, objetivo){

    movimientoCamara = {

        inicio:
            performance.now(),

        duracion:
            900,

        posDesde:
            camera.position.clone(),

        posHasta:
            new THREE.Vector3(...posicion),

        objDesde:
            controls.target.clone(),

        objHasta:
            new THREE.Vector3(...objetivo)

    };

}

function actualizarMovimientoCamara(ahora){

    if(!movimientoCamara){
        return;
    }

    const m = movimientoCamara;

    const k =
        Math.min(
            1,
            (ahora - m.inicio) / m.duracion
        );

    // Arranca y termina despacio
    const suave =
        k < .5 ?
        4 * k * k * k :
        1 - Math.pow(-2 * k + 2, 3) / 2;

    camera.position.lerpVectors(
        m.posDesde,
        m.posHasta,
        suave
    );

    controls.target.lerpVectors(
        m.objDesde,
        m.objHasta,
        suave
    );

    if(k >= 1){

        movimientoCamara = null;

    }

    pedirRender();

}


window.vistaAerea =
function(){

    irA(
        [-20, 125, 10],
        [-27, 0, 5]
    );

};


window.vistaFrontal =
function(){

    irA(

    );

};


window.vistaArriba =

};


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        pedirRender();

    }
);


// ============================================================
// ANIMACIÓN
// ============================================================

controls.addEventListener(
    "change",
    pedirRender
);

function animar(ahora){

    requestAnimationFrame(
        animar
    );

    actualizarMovimientoCamara(ahora);

    controls.update();

    // Solo se dibuja si la cámara o la escena cambiaron
    if(necesitaRender){

        necesitaRender = false;

        renderer.render(
            scene,
            camera
        );

    }

}


// ============================================================
// INICIAR
// ============================================================

animar(performance.now());
