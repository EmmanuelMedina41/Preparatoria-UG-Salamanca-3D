<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#151515;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dfe5e8;
    color:#263238;
    font-size:22px;
    font-weight:bold;
}

#titleBox{
    position:fixed;
    z-index:10;
    top:18px;
    left:18px;
    width:320px;
    padding:18px;
    background:rgba(255,255,255,.94);
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

#titleBox h1{
    margin:0 0 8px 0;
    font-size:21px;
}

#titleBox p{
    margin:5px 0;

    font-size:13px;
    line-height:1.4;
}

#buttons{
    margin-top:12px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    margin:3px;
    background:#263238;
    color:white;
    cursor:pointer;
    font-size:13px;
}

button:hover{

}

/* ============================================================
   PANEL DE INFORMACIÓN
   ============================================================ */

#information{
    display:none;
    position:fixed;
    z-index:20;
    top:18px;
    right:18px;
    width:330px;
    max-height:calc(100vh - 36px);
    overflow-y:auto;
    padding:18px;
    background:rgba(255,255,255,.97);
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.28);
}

#information h2{
    margin:0 0 8px;
    font-size:20px;
}

#information h3{
    margin:15px 0 5px;
    font-size:14px;
    color:#263238;
}

#information p{
    margin:7px 0;
    color:#444;
    line-height:1.45;
    font-size:14px;
}

#information .tipo{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e8f5e9;
    color:#2e7d32;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

/* ============================================================
   INFOGRAFÍA DE ÁRBOLES
   ============================================================ */

.treeInfographic{
    margin-top:12px;
    padding:12px;
    background:#f1f8f3;
    border-radius:12px;

    color:#47704b;
    font-style:italic;
    margin-bottom:9px;
}

.treeGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.treeCard{
    background:white;
    border-radius:9px;
    padding:8px;
    border:1px solid #e2e2e2;
}

.treeCard b{
    display:block;
    font-size:11px;

}

.treeCard span{
    display:block;
    font-size:12px;
    color:#444;

}

#help{

    bottom:18px;
    left:18px;
    background:rgba(255,255,255,.9);
    padding:10px 14px;
    border-radius:10px;
    font-size:12px;
    color:#444;
}

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


// ============================================================
// ESCENA
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0xc7cdd0);


// ============================================================
// CÁMARA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        48,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    75,
    80,
    95
);


// ============================================================
// RENDER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// CONTROLES
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = .055;

controls.minDistance = 20;

controls.maxDistance = 170;

controls.maxPolarAngle =
    Math.PI / 2.05;

controls.target.set(
    -25,
    0,
    5
);


// ============================================================
// ILUMINACIÓN
// ============================================================

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x737373,
        2.1
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.7
    );

sun.position.set(
    -60,
    120,
    70
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


// ============================================================
// TERRENO
// ============================================================

const terrenoGeo =
    new THREE.BoxGeometry(
        106,
        1,
        104
    );

const terrenoMat =
    new THREE.MeshStandardMaterial({
        color:0xd7d7d7,
        roughness:.95
    });

const terreno =
    new THREE.Mesh(
        terrenoGeo,
        terrenoMat
    );

terreno.position.set(
    -27,
    -.5,
    5
);

terreno.receiveShadow = true;

scene.add(terreno);


// ============================================================
// GRUPOS
// ============================================================

const edificios = [];

const arboles = [];


// ============================================================
// FUNCIÓN PRINCIPAL DE EDIFICIO
// ============================================================

function crearEdificio(opciones){

    const {

        nombre,
        descripcion,

        x,
        z,

        ancho,
        fondo,

        altura,

        niveles = 1,

        color = 0xe5e5e5,

        ventanas = true,

        fachada = true

    } = opciones;


    const grupo =
        new THREE.Group();


    grupo.position.set(
        x,
        0,
        z
    );


    grupo.userData.nombre =
        nombre;

    grupo.userData.descripcion =
        descripcion;

    grupo.userData.tipo =
        "Edificio";


    // --------------------------------------------------------
    // CUERPO
    // --------------------------------------------------------

    const cuerpoGeo =
        new THREE.BoxGeometry(
            ancho,
            altura,
            fondo
        );

    const cuerpoMat =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.8
        });

    const cuerpo =
        new THREE.Mesh(
            cuerpoGeo,
            cuerpoMat
        );

    cuerpo.position.y =
        altura / 2;

    cuerpo.castShadow = true;
    cuerpo.receiveShadow = true;

    grupo.add(cuerpo);


    // --------------------------------------------------------
    // ZONAS DE PISO
    // --------------------------------------------------------

    if(niveles > 1){

        for(
            let i=1;
            i<niveles;
            i++
        ){

            const y =
                altura *
                (i/niveles);


            const lineaGeo =
                new THREE.BoxGeometry(
                    ancho + .08,
                    .12,
                    fondo + .08
                );

            const lineaMat =
                new THREE.MeshStandardMaterial({
                    color:0xb8b8b8
                });

            const linea =
                new THREE.Mesh(
                    lineaGeo,
                    lineaMat
                );

            linea.position.y = y;

            linea.castShadow = true;

            grupo.add(linea);
        }
    }


    // --------------------------------------------------------
    // TECHO
    // --------------------------------------------------------

    const techoGeo =
        new THREE.BoxGeometry(
            ancho + .3,
            .25,
            fondo + .3
        );

    const techoMat =
        new THREE.MeshStandardMaterial({
            color:0xd4d4d4,
            roughness:.85
        });

    const techo =
        new THREE.Mesh(
            techoGeo,
            techoMat
        );

    techo.position.y =
        altura + .12;

    techo.castShadow = true;

    grupo.add(techo);


    // --------------------------------------------------------
    // FACHADA
    // --------------------------------------------------------

    if(fachada){

        const fachadaGeo =
            new THREE.BoxGeometry(
                ancho * .72,
                Math.min(
                    2.7,
                    altura*.40
                ),
                .14
            );

        const fachadaMat =
            new THREE.MeshStandardMaterial({
                color:0xf1f1f1
            });

        const fachadaObj =
            new THREE.Mesh(
                fachadaGeo,
                fachadaMat
            );

        fachadaObj.position.set(
            0,
            Math.min(
                2.7,
                altura*.40
            ) / 2 + .25,
            fondo/2 + .08
        );

        grupo.add(
            fachadaObj
        );
    }


    // --------------------------------------------------------
    // VENTANAS
    // --------------------------------------------------------

    if(ventanas){

        const numeroVentanas =
            Math.max(
                3,
                Math.floor(
                    ancho / 4
                )
            );


        for(
            let i=0;
            i<numeroVentanas;
            i++
        ){

            const ventanaGeo =
                new THREE.BoxGeometry(
                    1.5,
                    1.45,
                    .08
                );

            const ventanaMat =
                new THREE.MeshStandardMaterial({
                    color:0x91aab5,
                    roughness:.3,
                    metalness:.05
                });

            const ventana =
                new THREE.Mesh(
                    ventanaGeo,
                    ventanaMat
                );


            const separacion =
                ancho /
                (numeroVentanas + 1);

            ventana.position.x =
                -ancho/2 +
                separacion *
                (i+1);

            ventana.position.y =
                Math.min(
                    altura-.9,
                    Math.max(
                        2,
                        altura*.57
                    )
                );

            ventana.position.z =
                fondo/2 + .15;

            grupo.add(
                ventana
            );
        }
    }


    // --------------------------------------------------------
    // PUERTA
    // --------------------------------------------------------

    const puertaGeo =
        new THREE.BoxGeometry(
            1.9,
            2.8,
            .10
        );

    const puertaMat =
        new THREE.MeshStandardMaterial({
            color:0x4b5960,
            roughness:.5
        });

    const puerta =
        new THREE.Mesh(
            puertaGeo,
            puertaMat
        );

    puerta.position.set(
        0,
        1.4,
        fondo/2 + .16
    );

    grupo.add(
        puerta
    );


    // --------------------------------------------------------
    // ESCALERA
    // --------------------------------------------------------

    if(
        niveles > 1 &&
        ancho > 15
    ){

        const escaleraGrupo =
            new THREE.Group();


        for(
            let i=0;
            i<6;
            i++
        ){

            const escalonGeo =
                new THREE.BoxGeometry(
                    3.4,
                    .25,
                    .55
                );

            const escalonMat =
                new THREE.MeshStandardMaterial({
                    color:0xbdbdbd
                });

            const escalon =
                new THREE.Mesh(
                    escalonGeo,
                    escalonMat
                );

            escalon.position.set(
                ancho*.28,
                .125 + i*.22,
                fondo/2 +
                .55 +
                i*.42
            );

            escalon.castShadow = true;

            escaleraGrupo.add(
                escalon
            );
        }

        grupo.add(
            escaleraGrupo
        );
    }


    scene.add(
        grupo
    );

    edificios.push(
        grupo
    );

    return grupo;
}


// ============================================================
// EDIFICIOS
// ============================================================

// GIMNASIO

crearEdificio({

// DIRECCIÓN

// ============================================================
// FUNCIONES AUXILIARES PARA ÁRBOLES
// ============================================================

function crearRama(
    grupo,
    x,
    y,
    z,
    largo,
    grosor,
    rotX = 0,
    rotZ = 0,
    color = 0x765438
){

    const geo =
        new THREE.CylinderGeometry(
            grosor*.75,
            grosor,
            largo,
            6
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        });

    const rama =
        new THREE.Mesh(
            geo,
            mat
        );

    rama.position.set(
        x,
        y,
        z
    );

    rama.rotation.x =
        rotX;

    rama.rotation.z =
        rotZ;

    rama.castShadow = true;

    grupo.add(
        rama
    );

    return rama;
}


// ============================================================
// GUAYABERO
// ============================================================

function crearGuayabero(grupo){

    const troncoGeo =
        new THREE.CylinderGeometry(
            .30,
            .43,
            3.8,
            8
        );

    const troncoMat =
        new THREE.MeshStandardMaterial({
            color:0x765438,
            roughness:.9
        });

    const tronco =
        new THREE.Mesh(
            troncoGeo,
            troncoMat
        );

    tronco.position.y =
        1.9;

    tronco.castShadow = true;

    grupo.add(tronco);


    crearRama(
        grupo,
        -.65,
        3.1,
        0,
        2.0,
        .14,
        0,
        -.55
    );

    crearRama(
        grupo,
        .65,
        3.2,
        .1,
        2.1,
        .14,
        0,
        .55
    );

    crearRama(
        grupo,
        0,
        3.5,
        .55,
        1.8,
        .13,
        .45,
        0
    );


    const colores = [
        0x4c8b42,
        0x5a9749,
        0x3f7d3a
    ];


    const posiciones = [

        [-1.15,4.0,0],
        [1.1,4.05,.1],
        [0,4.65,.4],
        [-.45,4.8,-.6],
        [.7,4.7,-.55]

    ];


    posiciones.forEach(
        (p,i)=>{

            const geo =
                new THREE.SphereGeometry(
                    1.45,
                    8,
                    6
                );

            const mat =
                new THREE.MeshStandardMaterial({
                    color:colores[i%colores.length],
                    roughness:.95
                });

            const copa =
                new THREE.Mesh(
                    geo,
                    mat
                );

            copa.position.set(
                p[0],
                p[1],
                p[2]
            );

            copa.scale.set(
                1.05,
                .9,
                1
            );

            copa.castShadow = true;

            grupo.add(copa);
        }
    );


    // GUAYABAS

    const posicionesFrutos = [

        [-1.15,4.75,.5],
        [.95,4.35,.65],
        [.2,5.2,-.5],
        [-.7,4.25,-.8],
        [1.15,4.8,-.2]

    ];


    posicionesFrutos.forEach(
        p=>{

            const geo =
                new THREE.SphereGeometry(
                    .18,
                    7,
                    5
                );

            const mat =
                new THREE.MeshStandardMaterial({
                    color:0xd6d875,
                    roughness:.8
                });

            const fruto =
                new THREE.Mesh(
                    geo,
                    mat
                );

            fruto.position.set(
                p[0],
                p[1],
                p[2]
            );

            grupo.add(fruto);
        }
    );

}


// ============================================================
// EUCALIPTO
// ============================================================

function crearEucalipto(grupo){

    const troncoGeo =
        new THREE.CylinderGeometry(
            .24,
            .36,
            7.5,
            8
        );

    const troncoMat =
        new THREE.MeshStandardMaterial({
            color:0x706653,
            roughness:.9
        });

    const tronco =
        new THREE.Mesh(
            troncoGeo,
            troncoMat
        );

    tronco.position.y =
        3.75;

    tronco.castShadow = true;

    grupo.add(tronco);


    crearRama(
        grupo,
        -.5,
        5.1,
        0,
        2,
        .10,
        0,
        -.5
    );

    crearRama(
        grupo,
        .5,
        5.8,
        0,
        2,
        .10,
        0,
        .5
    );

    crearRama(
        grupo,
        -.4,
        6.6,
        .1,
        1.7,
        .09,
        0,
        -.5
    );


    const posiciones = [

        [0,5.3,0],
        [-.7,5.8,0],
        [.7,6.0,.1],
        [-.55,6.7,.1],
        [.55,6.9,0],
        [0,7.5,.1],
        [0,8.25,0]

    ];


    posiciones.forEach(
        (p,i)=>{

            const geo =
                new THREE.SphereGeometry(
                    .95,
                    7,
                    5
                );

            const mat =
                new THREE.MeshStandardMaterial({
                    color:
                        i%2===0
                        ? 0x688b73
                        : 0x78977f,
                    roughness:.95
                });

            const hoja =
                new THREE.Mesh(
                    geo,
                    mat
                );

            hoja.position.set(
                p[0],
                p[1],
                p[2]
            );

            hoja.scale.set(
                .72,
                1.25,
                .72
            );

            hoja.castShadow = true;

            grupo.add(hoja);
        }
    );

}


// ============================================================
// FICUS VARIEGADO
// ============================================================

function crearFicusVariegado(grupo){

    const troncoGeo =
        new THREE.CylinderGeometry(
            .30,
            .45,
            3.7,
            8
        );

    const troncoMat =
        new THREE.MeshStandardMaterial({
            color:0x765438,
            roughness:.9
        });

    const tronco =
        new THREE.Mesh(
            troncoGeo,
            troncoMat
        );

    tronco.position.y =
        1.85;

    tronco.castShadow = true;

    grupo.add(tronco);


    crearRama(
        grupo,
        -.65,
        3.0,
        0,
        2,
        .13,
        0,
        -.55
    );

    crearRama(
        grupo,
        .65,
        3.15,
        0,
        2,
        .13,
        0,
        .55
    );


    // BASE AMARILLENTA

    const posiciones = [

        [-1.15,4.0,0],
        [1.15,4.0,.1],
        [0,4.6,.4],

// ============================================================
// FUNCIÓN PRINCIPAL PARA CREAR ÁRBOLES
// ============================================================

function crearArbol(opciones){

    const {

        nombre,
        especie,
        descripcion,
        importancia,
        beneficio,

        x,
        z,

        escala = 1,

        modelo = "ficus",

        alturaInfo = "",
        caracteristica = "",
        dato = ""

    } = opciones;


    const grupo =
        new THREE.Group();


    grupo.position.set(
        x,
        0,
        z
    );


    grupo.scale.set(
        escala,
        escala,
        escala
    );


    // --------------------------------------------------------
    // INFORMACIÓN
    // --------------------------------------------------------

    grupo.userData.nombre =
        nombre;

    grupo.userData.descripcion =
        descripcion;

    grupo.userData.tipo =
        "Árbol";

    grupo.userData.especie =
        especie;

    grupo.userData.importancia =
        importancia;

    grupo.userData.beneficio =
        beneficio;

    grupo.userData.alturaInfo =
        alturaInfo;

    grupo.userData.caracteristica =
        caracteristica;

    grupo.userData.dato =
        dato;


    // --------------------------------------------------------
    // MODELO VISUAL
    // --------------------------------------------------------

    if(modelo === "guayabero"){

        crearGuayabero(grupo);

    }

    else if(modelo === "eucalipto"){

        crearEucalipto(grupo);

    }

    else if(modelo === "ficus-variegado"){

        crearFicusVariegado(grupo);

    }

    else if(modelo === "araucaria"){

        crearAraucaria(grupo);

    }

    else{

        crearFicus(grupo);

    }


    scene.add(
        grupo
    );


    arboles.push(
        grupo
    );


    return grupo;
}

function crearEtiqueta(
    texto,
    x,
    y,
    z
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "rgba(255,255,255,.92)";

    ctx.roundRect(
        5,
        5,
        502,
        118,
        18
    );

    ctx.fill();

    ctx.fillStyle =
        "#263238";

    ctx.font =
        "bold 42px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        texto,
        256,
        64
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.position.set(
        x,
        y,
        z
    );

    sprite.scale.set(
    16,
    4,
    1
);

    scene.add(
        sprite
    );
}

// ============================================================
// INTERACCIÓN
// ============================================================

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


window.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.target.tagName ===
            "BUTTON"
        ){
            return;
        }


        mouse.x =
            (event.clientX /
            window.innerWidth) *
            2 - 1;

        mouse.y =
            -(event.clientY /
            window.innerHeight) *
            2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        // ====================================================
        // OBJETOS INTERACTIVOS
        // ====================================================

        const objetos = [];


        // EDIFICIOS

        edificios.forEach(
            edificio => {

                edificio.traverse(
                    objeto => {

                        if(
                            objeto.isMesh
                        ){

                            objetos.push(
                                objeto
                            );

                        }

                    }
                );

            }
        );


        // ÁRBOLES

        arboles.forEach(
            arbol => {

                arbol.traverse(
                    objeto => {

                        if(
                            objeto.isMesh
                        ){

                            objetos.push(
                                objeto
                            );

                        }

                    }
                );

            }
        );


        const intersecciones =
            raycaster.intersectObjects(
                objetos
            );


        if(
            intersecciones.length === 0
        ){

            return;

        }


        let objeto =
            intersecciones[0].object;


        // Buscar grupo padre interactivo

        while(
            objeto.parent &&
            !objeto.userData.nombre
        ){

            objeto =
                objeto.parent;

        }


        if(
            !objeto.userData.nombre
        ){

            return;

        }


        // ====================================================
        // MOSTRAR INFORMACIÓN
        // ====================================================

        document.getElementById(
            "infoTitle"
        ).textContent =
            objeto.userData.nombre;


        document.getElementById(
            "infoText"
        ).textContent =
            objeto.userData.descripcion;


        const tipo =
            objeto.userData.tipo ||
            "Elemento";


        document.getElementById(
            "infoType"
        ).textContent =
            tipo;


        // ====================================================
        // INFORMACIÓN DE ÁRBOLES
        // ====================================================

        const extra =
            document.getElementById(
                "infoExtra"
            );


        extra.innerHTML = "";


        if(
            objeto.userData.tipo ===
            "Árbol"
        ){

            extra.innerHTML = `

                <div class="treeInfographic">

                    <div class="treeScientific">

                        🌿 ${objeto.userData.especie}

                    </div>


                    <div class="treeGrid">

                        <div class="treeCard">

                            <b>📏 Altura</b>

                            <span>
                                ${objeto.userData.alturaInfo}
                            </span>

                        </div>


                        <div class="treeCard">

                            <b>🍃 Característica</b>

                            <span>
                                ${objeto.userData.caracteristica}
                            </span>

                        </div>


                        <div class="treeCard">

                            <b>🌎 Importancia</b>

                            <span>
                                ${objeto.userData.importancia}
                            </span>

                        </div>


                        <div class="treeCard">

                            <b>💧 Beneficio</b>

                            <span>
                                ${objeto.userData.beneficio}
                            </span>

                        </div>

                    </div>


                    <h3>💡 Dato interesante</h3>

                    <p>
                        ${objeto.userData.dato}
                    </p>

                </div>

            `;

        }


        // ====================================================
        // MOSTRAR PANEL
        // ====================================================

        document.getElementById(
            "information"
        ).style.display =
            "block";

    }
);
